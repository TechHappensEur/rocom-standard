# FILE: .github/workflows/spectral.yaml
name: Spectral Lint

on:
  push:
    branches: [main]
    paths:
      - 'api/*.yaml'
      - 'spec/**/*.yaml'
      - '.spectral*.yaml'
      - '.github/workflows/spectral.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint-asyncapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @stoplight/spectral-cli @stoplight/spectral-rulesets
      - name: Lint AsyncAPI binding
        run: npx @stoplight/spectral-cli lint "api/*.yaml" --ruleset .spectral-asyncapi.yaml --verbose

  lint-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @stoplight/spectral-cli @stoplight/spectral-rulesets
      - name: Lint OpenAPI specs
        run: npx @stoplight/spectral-cli lint "spec/**/*.yaml" --ruleset .spectral.yaml --verbose
