# FILE: .github/workflows/spectral.yaml
name: Spectral Lint

on:
  push:
    branches: [main]
    paths:
      - 'api/*.yaml'
      - '.spectral*.yaml'
      - '.github/workflows/spectral.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint AsyncAPI binding
        uses: stoplightio/spectral-action@latest
        with:
          file_glob: "api/*.yaml"
          spectral_ruleset: .spectral-asyncapi.yaml
