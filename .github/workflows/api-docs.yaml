# FILE: .github/workflows/api-docs.yaml
name: Standard Docs

on:
  push:
    branches: [main]
    paths:
      - api/rocom-vda5050-binding.yaml
      - spec/**/*.yaml
      - spec/**/*.md
      - build/**
      - .github/workflows/api-docs.yaml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-api
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Validate AsyncAPI binding
        run: |
          python3 << 'PYEOF'
          import yaml, sys
          with open('api/rocom-vda5050-binding.yaml') as f:
              doc = yaml.safe_load(f)
          assert doc.get('asyncapi', '').startswith('3.'), 'Not AsyncAPI 3.x'
          assert 'channels' in doc, 'Missing channels'
          assert 'info' in doc, 'Missing info block'
          print(f'AsyncAPI {doc["asyncapi"]}: {len(doc["channels"])} channels valid')
          PYEOF

      - name: Build site
        run: bash build/build.sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
