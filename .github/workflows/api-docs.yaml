# FILE: .github/workflows/api-docs.yaml
name: Standard Docs

on:
  push:
    branches: [main]
    paths:
      - api/rocom-vda5050-binding.yaml
      - spec/**/*.yaml
      - spec/**/*.md
      - docs/**
      - .github/workflows/api-docs.yaml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-api
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: npm install -g @asyncapi/openapi-schema-parser

      - name: Validate AsyncAPI binding
        run: |
          python3 << 'PYEOF'
          import yaml, sys
          with open('api/rocom-vda5050-binding.yaml') as f:
              doc = yaml.safe_load(f)
          assert doc.get('asyncapi', '').startswith('3.'), 'Not AsyncAPI 3.x'
          assert 'channels' in doc, 'Missing channels'
          assert 'info' in doc, 'Missing info block'
          print(f'AsyncAPI {doc["asyncapi"]}: {len(doc["channels"])} channels valid')
          PYEOF

      - name: Generate HTML docs
        run: |
          mkdir -p docs-output
          cp api/rocom-vda5050-binding.yaml docs-output/
          cp -r spec/ docs-output/
          cat > docs-output/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head><title>Rocom Standard — API Documentation</title>
          <style>body{font-family:monospace;max-width:900px;margin:2em auto;padding:0 1em}pre{white-space:pre-wrap}</style>
          </head>
          <body>
          <h1>Rocom VDA 5050 Binding</h1>
          <p>AsyncAPI 3.0.0 binding specification.</p>
          <pre id="spec"></pre>
          <script>fetch('rocom-vda5050-binding.yaml').then(r=>r.text()).then(t=>document.getElementById('spec').textContent=t)</script>
          </body>
          </html>
          HTMLEOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
