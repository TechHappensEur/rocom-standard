<!DOCTYPE html>
<html>
<head>
  <title><%= title %></title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .version-banner {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 12px 20px;
      text-align: center;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      position: relative;
    }
    .version-banner strong {
      color: #664d03;
    }
    .version-banner a {
      color: #856404;
      text-decoration: underline;
    }
    .download-bar {
      background: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
      padding: 8px 20px;
      text-align: right;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .download-bar a {
      color: #007bff;
      text-decoration: none;
      margin-left: 16px;
    }
    .download-bar a:hover {
      text-decoration: underline;
    }
  </style>
  <% redocHead %>
</head>
<body>

  <div class="version-banner">
    <strong>⚠ DRAFT v<%= spec.version %></strong> — Rocom Standard is under active development. Changes may occur without notice.
    Not for production use.
    <a href="https://github.com/TechHappensEur/rocom-standard">Repository &amp; issues</a>
  </div>

  <div class="download-bar">
    <span>Spec:</span>
    <a href="rocom-vda5050-binding.yaml" download>
      ↓ VDA 5050 Binding YAML
    </a>
    <span style="margin-left: 24px;">Profile:</span>
    <a href="../spec/part-05-transport/PROFILE.md" download>
      ↓ Transport Profile
    </a>
  </div>

  <redoc spec-url='rocom-vda5050-binding.yaml'
         expand-response-codes="200,201"
         hide-hostname="true"
         native-scrollbars="true">
  </redoc>

  <script src="<%= redocScript %>"></script>
</body>
</html>
