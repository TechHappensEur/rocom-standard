rules:
  has-version:
    description: API spec must declare a version field (asyncapi or openapi)
    given: $
    severity: error
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - required: [asyncapi]
            - required: [openapi]
  has-info:
    description: API spec must have an info block with title
    given: $
    severity: error
    then:
      function: schema
      functionOptions:
        schema:
          properties:
            info:
              type: object
              properties:
                title:
                  type: string
              required:
                - title
          required:
            - info
